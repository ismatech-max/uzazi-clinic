<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzazi Clinic - Ingia</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-96 border-t-4 border-[#0d5c35]">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-black text-[#0d5c35] tracking-widest">UZAZI CLINIC</h2>
            <p class="text-gray-500 text-sm mt-1">Ingia kwenye mfumo</p>
        </div>
        
        {% if messages %}
        <div class="bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm text-center font-medium">
            {% for message in messages %} {{ message }} {% endfor %}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-gray-700 text-xs font-bold mb-2 uppercase">Jina (Username)</label>
                <input type="text" name="username" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#0d5c35] transition" required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-xs font-bold mb-2 uppercase">Nenosiri (Password)</label>
                <input type="password" name="password" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#0d5c35] transition" required>
            </div>
            <button type="submit" class="w-full bg-[#0d5c35] text-white font-bold py-3 px-4 rounded-lg hover:bg-green-800 transition duration-300 shadow-md">
                INGIA NDANI
            </button>
        </form>
    </div>
</body>
</html>
